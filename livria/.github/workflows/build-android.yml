name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      [
        "src/**",
        "public/**",
        "android/**",
        "package*.json",
        "capacitor.config.ts",
        "vite.config.ts",
        ".github/workflows/build-android.yml",
      ]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx cap sync android
      - name: Prepare optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/livria-release.jks"
          fi
      - name: Compile APK
        working-directory: android
        env:
          LIVRIA_KEYSTORE: ${{ runner.temp }}/livria-release.jks
          LIVRIA_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          LIVRIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LIVRIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          if [ -n "$LIVRIA_STORE_PASSWORD" ]; then ./gradlew assembleRelease --no-daemon; fi
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LIVRIA-Android-${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
