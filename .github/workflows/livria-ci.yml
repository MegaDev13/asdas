name: LIVRIA - Web e qualidade
on:
  push:
    branches: ['livria/**']
    paths: ['livria/**', '.github/workflows/livria-*.yml']
  pull_request:
    paths: ['livria/**', '.github/workflows/livria-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: livria-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: livria
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: livria/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: LIVRIA-Web-${{ github.run_number }}
          path: livria/dist
          if-no-files-found: error
          retention-days: 30
